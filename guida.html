<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organizer modulare · guida del prototipo</title><style>
:root{--bg:#f6f4f2;--ink:#2c2629;--muted:#6f666a;--line:#e4dcdc;--accent:#1b6959;--card:#fff;--viewer:#1f1b1d;--gold:#e6b84f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:var(--accent)}button,input,select{font:inherit}button{cursor:pointer}button,a,input{accent-color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:9px;font-size:14px}button:hover{border-color:var(--accent)}button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
header,main,footer{max-width:1240px;margin:auto;padding:0 28px}header{padding-top:32px;padding-bottom:26px}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:750;color:var(--accent)}

.intro{color:var(--muted);max-width:850px}.facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.fact{border:1px solid var(--line);border-radius:99px;background:#fff;padding:6px 13px;font-size:14px}.fact b{color:var(--accent)}
nav{display:flex;gap:20px;font-size:14px;margin-top:20px;flex-wrap:wrap}nav a{text-decoration:none;font-weight:650}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:18px}
.viewer{border-radius:18px;background:var(--viewer);color:#fff;overflow:hidden;position:relative;min-width:0}
.viewbar{display:flex;gap:7px;flex-wrap:wrap;padding:16px;border-bottom:1px solid rgba(255,255,255,.12)}.viewbar button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#f2eef0;padding:7px 11px}.viewbar button.active{background:#efe9eb;color:#2c2629}
.camera-controls{align-items:center;padding:10px 16px}.camera-controls label,.camera-controls output{font-size:12px}.camera-controls input{width:110px;min-width:70px}.camera-controls output{min-width:45px}
.camera-controls select{max-width:150px;background:rgba(255,255,255,.08);color:#f2eef0;border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:7px;font-size:13px}.camera-controls option{color:#222}
.canvas-wrap{height:520px;position:relative}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.view-hint{position:absolute;bottom:12px;left:16px;right:16px;font-size:11px;opacity:.7;pointer-events:none}
.viewcaption{padding:12px 17px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#e2dade;min-height:50px}
.viewer:fullscreen,.viewer.fullscreen-fallback{display:flex;flex-direction:column;width:100vw;height:100dvh;border-radius:0}.viewer:fullscreen .canvas-wrap,.viewer.fullscreen-fallback .canvas-wrap{flex:1;min-height:100px;height:auto}.viewer.fullscreen-fallback{position:fixed;inset:0;z-index:99999}

.badge{display:inline-block;font-weight:750;letter-spacing:.02em;font-size:11px;padding:4px 9px;border-radius:6px;background:color-mix(in srgb,var(--accent) 12%,white);color:var(--accent);margin-bottom:12px;text-transform:uppercase}
.muted,.small{color:var(--muted)}.small{font-size:12px}.part-id{font-size:30px;font-weight:750;line-height:1;margin:8px 0 9px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{padding:5px 9px;font-size:12px}
.download{display:inline-block;text-decoration:none;background:var(--accent);color:#fff;border-radius:9px;padding:9px 13px;font-weight:650;font-size:14px;margin:14px 0 7px}
#selection{min-height:250px}.pin-note{margin-top:auto;border-top:1px solid var(--line);padding-top:15px;font-size:12px}
section{scroll-margin-top:20px;margin-top:34px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.section-head p{margin:0}

.step .num{border-radius:50%;width:24px;height:24px;text-align:center;line-height:24px;background:color-mix(in srgb,var(--accent) 12%,white);font-weight:700;color:var(--accent)}
.step-detail{margin-top:12px;border-left:4px solid var(--accent);background:#fff;padding:19px 22px;border-radius:0 12px 12px 0;min-height:132px}
.motion{margin-top:15px;background:color-mix(in srgb,var(--accent) 6%,white);padding:13px;border-radius:10px}.slider{width:100%}
.maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.map-grid{display:grid;gap:8px;max-width:390px;margin:14px auto}.map-part{height:58px;font-weight:750;font-size:16px;color:#2c2629}.map-part.active{outline:3px solid var(--accent);outline-offset:1px}
.direction{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);text-align:center}
.inventory-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.progress{height:8px;background:var(--line);border-radius:10px;overflow:hidden;margin:12px 0 9px}.progress>div{height:100%;background:var(--accent);width:0}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th{text-align:left;padding:12px 10px;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line)}tr.selected{background:color-mix(in srgb,var(--accent) 8%,white)}td button{padding:3px 8px;font-size:13px;font-weight:750}td input[type=checkbox]{width:18px;height:18px;vertical-align:middle}input[type=number]{width:62px;border:1px solid var(--line);padding:5px;border-radius:6px}td:last-child{text-align:right}
.print-settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0 18px}.print-profile{border:1px solid var(--line);background:#fbfafa;border-radius:13px;padding:14px}.print-profile h3{margin-bottom:7px}
.print-profile dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:12px}.print-profile dt{color:var(--muted)}.print-profile dd{margin:0;font-weight:700}.print-profile .why{margin:9px 0 0;font-size:11px;color:var(--muted)}
.print-inline{margin:12px 0;padding:11px 12px;background:#fbf9f9;border:1px solid var(--line);border-radius:10px}.print-inline b{display:block;margin-bottom:5px}.print-inline span{display:block;font-size:12px}
.print-common{font-size:12px;color:var(--muted);margin:0 0 10px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}.notes p,.notes li{font-size:13px}.notes svg,.notes img{width:100%;height:auto}
.warning{background:#fcf3df;border:1px solid #e7d4a8;padding:15px 18px;border-radius:12px;margin:14px 0 0;font-size:13px}
.links{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}footer{padding-top:25px;padding-bottom:30px;font-size:12px;color:var(--muted)}
#jsError{display:none}body[data-error] #jsError{display:block}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:20px}#selection{min-height:0}.pin-note{border:0;margin:0}.canvas-wrap{height:440px}}
@media(max-width:600px){header,main,footer{padding-left:16px;padding-right:16px}.sidebar{display:block}.canvas-wrap{height:360px}.section-head{display:block}.camera-controls input{width:90px}}
@media print{body{background:#fff;font-size:12px}header,main,footer{padding:0;max-width:none}.workspace,.viewbar,.progress,nav,#clearProgress,.steps,.download,.links{display:none}.card{break-inside:avoid}}

const DATA={"root":"..","title":"Organizer modulare · guida del prototipo","theme":{"accent":"#557e6b","viewer_bg":"#25332e"},"header":{"eyebrow":"Organizer modulare · incastri e presa integrata","h1":"Un modulo, tre livelli configurabili.","intro_html":"<b>Montanti e traverse hanno tenoni e sedi cieche.</b> Le guide si agganciano con tre linguette per lato; il cassetto ha una presa incassata con un piccolo labbro. Questa guida mostra un modulo standard da ripetere tre volte. Per misure diverse apri il <a href=\"configuratore.html\">configuratore JavaScript</a>.","facts":[{"value":"320 × 340 mm","label":"impronta esterna"},{"value":"106 mm","label":"passo per livello"},{"value":"13 + 13","label":"sedi per lato"},{"value":"16 STL","label":"pezzi del modulo"}]},"camera":{"yaw":-0.66,"pitch":0.55},"caption":"Un modulo visto dall’alto: ruota, esplodi e seleziona i pezzi. Il frontale aperto è il lato da cui scorre il cassetto.","model_note_html":"<span class=\"badge\">Prototipo da verificare</span><p>Tenoni dei traversi 6 × 5 × 8 mm con gioco nominale 0,35 mm per lato; tre linguette per guida; presa incassata 42 × 10 mm con labbro da 2,5 mm. Stampa un provino per verificare giochi e portata.</p>","groups":{"Telaio":{"color":"#d5c8ab"},"Guide":{"color":"#4d5559"},"Cassetto":{"color":"#638c78"},"Divisori":{"color":"#b97058"},"Fermi":{"color":"#d09a62"}},"steps_section":{"eyebrow":"01 / Montaggio geometrico","h2":"Assembla un modulo, poi ripeti.","intro_html":"Le posizioni sono ricavate dagli STL. I giunti sono modellati ma i giochi e il comportamento sotto carico vanno provati fisicamente.","start_html":"<h3>Prima della stampa</h3><p>Controlla il volume del piatto: cassetto 275 × 310 mm, longheroni fino a 312 mm. Stampa un provino del tenone 6 × 5 × 8 mm, delle linguette e delle scanalature.</p>"},"map":{"eyebrow":"02 / Mappa","h2":"Sedici STL per un modulo.","cards":[{"title":"Pezzi e posizioni","columns":6,"top_label":"Telaio · guide · cassetto","bottom_label":"Fronte aperto","ids":["P01","P02","P03","P04","P05","P06","P07","P08","P09","P10","P11","P12","P13","P14","P15","P16"],"note_html":"Per tre livelli stampa tre copie di ogni STL; i pezzi speculari restano file separati per rendere chiara la posa."}],"joints_title":"Tenoni e sedi del telaio","joints_note_html":"I tenoni dei traversi entrano nelle sedi cieche dei montanti; le guide si innestano nei longheroni bassi. I fermi richiedono ancora un fissaggio verificato."},"print":{"eyebrow":"03 / Stampa","h2":"Lista e parametri iniziali.","common_html":"<b>Punto di partenza da verificare:</b> PLA/PLA+, ugello 0,4 mm, layer 0,20 mm. Importa gli STL al 100% in millimetri. Dimensioni e giochi non sono ancora calibrati su una stampante reale.","profiles":[{"key":"struttura","title":"Montanti e traversi","rows":[["Pareti","5"],["Infill","25%"],["Orientamento","longheroni piatti; montanti verticali con brim"]],"why":"Il telaio porta il carico; sono impostazioni iniziali, non una portata certificata. Verificare con provini tenoni e sedi.","summary":"5 pareti · 25% · prova dei giunti"},{"key":"guide","title":"Guide laterali","rows":[["Pareti","5"],["Infill","25%"],["Orientamento","piatte sul piano"]],"why":"Le superfici di scorrimento devono restare dritte e parallele. Tarare il gioco con un provino.","summary":"5 pareti · 25% · superficie diritta"},{"key":"vassoio","title":"Cassetto","rows":[["Pareti","5"],["Infill","20%"],["Orientamento","fondo sul piatto"]],"why":"Il fondo e le pareti sostengono il contenuto; verificare che 275 × 310 mm entrino nel piatto.","summary":"5 pareti · 20% · fondo sul piatto"},{"key":"divisori","title":"Divisori rimovibili","rows":[["Pareti","3"],["Infill","10–15%"],["Orientamento","piatti"]],"why":"I divisori non sono portanti. Gli intagli richiedono una prova di incastro.","summary":"3 pareti · 10–15% · prova delle sedi"},{"key":"fermi","title":"Fermi","rows":[["Pareti","4"],["Infill","100%"],["Orientamento","piatti"]],"why":"Piccoli pezzi da testare per acc
