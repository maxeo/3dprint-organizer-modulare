const DATA={"root":"..","title":"Organizer modulare · guida del prototipo","theme":{"accent":"#557e6b","viewer_bg":"#25332e"},"header":{"eyebrow":"Organizer modulare · base parametrica · STL preliminari","h1":"Un modulo, tre livelli configurabili.","intro_html":"<b>Il telaio porta il carico; il cassetto resta estraibile.</b> Questa guida mostra un modulo standard da ripetere tre volte. Le scanalature del cassetto e del divisorio sono a passo 20 mm. Per cambiare misure e scaricare STL aggiornati senza Blender, apri il <a href=\"configuratore.html\">configuratore JavaScript</a>.","facts":[{"value":"320 × 340 mm","label":"impronta esterna"},{"value":"106 mm","label":"passo per livello"},{"value":"13 + 13","label":"sedi per lato"},{"value":"18 STL","label":"pezzi del modulo"}]},"camera":{"yaw":-0.66,"pitch":0.55},"caption":"Un modulo visto dall’alto: ruota, esplodi e seleziona i pezzi. Il frontale aperto è il lato da cui scorre il cassetto.","model_note_html":"<span class=\"badge\">Prototipo geometrico</span><p>Le pareti del cassetto hanno sedi da 3,0 × 1,0 mm a passo 20 mm. I contatti dei longheroni con i montanti non sono ancora giunti meccanici definitivi.</p>","groups":{"Telaio":{"color":"#d5c8ab"},"Guide":{"color":"#4d5559"},"Cassetto":{"color":"#638c78"},"Divisori":{"color":"#b97058"},"Fermi":{"color":"#d09a62"}},"steps_section":{"eyebrow":"01 / Montaggio geometrico","h2":"Assembla un modulo, poi ripeti.","intro_html":"Le posizioni sono ricavate dagli STL. Per i longheroni serve ancora un giunto reale: usa la sequenza come riferimento di progettazione, non come istruzione per caricare la torre.","start_html":"<h3>Prima della stampa</h3><p>Controlla il volume del piatto: cassetto 275 × 310 mm, longheroni fino a 318 mm. Stampa un provino delle sedi da 3,0 mm e del tenone da 8 mm.</p>"},"map":{"eyebrow":"02 / Mappa","h2":"Diciotto STL per un modulo.","cards":[{"title":"Pezzi e posizioni","columns":6,"top_label":"Telaio · guide · cassetto","bottom_label":"Fronte apert
